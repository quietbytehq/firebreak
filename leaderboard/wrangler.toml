# Firebreak global top 100: a Cloudflare Worker with a D1 database.
name = "firebreak-scores"
main = "src/worker.js"
compatibility_date = "2026-01-01"
workers_dev = false
routes = [{ pattern = "firebreak.quietbytehq.uk", custom_domain = true }]

[vars]
MIN_SCORE = "2000"
MAX_SCORE = "5000000"

[[d1_databases]]
binding = "DB"
database_name = "firebreak-scores"
database_id = "e9e18dd2-d080-4cf0-911f-2606c714cc1b"
