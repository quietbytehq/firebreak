name: firebreak
title: Firebreak
base: core24
version: '0.3.4'
summary: Operation Wolf-style gallery shooter in a jungle river village
description: |
  Hold the line in an Operation Wolf-style gallery shooter. Aim with the
  mouse or a gamepad as the battlefield pans slowly across a jungle river
  village at dusk. Shoot riflemen, machine-gun nests and paratroopers,
  spare the villagers, and shoot falling food and supplies for health,
  ammunition, grenades and weapon upgrades. Call in air strikes and bring
  down helicopters. Version 0.3.4 contains stage 1 of a planned twelve, with a global top 100.
  Mouse, keyboard and mapped gamepad controls. Offline, local top-ten
  scores. Linux x86-64, OpenGL 3.3 required.
  For gamepads, enable controller access with:
  sudo snap connect firebreak:joystick
grade: devel
confinement: strict
license: Apache-2.0
contact: hello@quietbytehq.uk
website: https://github.com/quietbytehq/firebreak
source-code: https://github.com/quietbytehq/firebreak
issues: https://github.com/quietbytehq/firebreak/issues
icon: snap/gui/firebreak.png
platforms:
  amd64:
apps:
  firebreak:
    command: bin/launch-firebreak
    extensions: [gnome]
    plugs: [audio-playback, joystick, network]
parts:
  game:
    plugin: dump
    source: build/snap-payload
    stage-packages: [libasound2t64, libpulse0, libxinerama1, libxcursor1, libxi6, libxrandr2]
