<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Firebreak">
  <defs>
    <linearGradient id="flameL" x1="0.2" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#c42800"/>
      <stop offset="50%" stop-color="#ff5a00"/>
      <stop offset="100%" stop-color="#ffd24a"/>
    </linearGradient>
    <linearGradient id="flameT" x1="0.3" y1="1" x2="0.6" y2="0">
      <stop offset="0%" stop-color="#d43800"/>
      <stop offset="55%" stop-color="#ff8a10"/>
      <stop offset="100%" stop-color="#ffe16a"/>
    </linearGradient>
    <linearGradient id="flameR" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c42800"/>
      <stop offset="50%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ffd24a"/>
    </linearGradient>
    <linearGradient id="flameB" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffb020"/>
      <stop offset="70%" stop-color="#ff5a00"/>
      <stop offset="100%" stop-color="#c42800"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="40%" stop-color="#f0c33a"/>
      <stop offset="100%" stop-color="#c86a10"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="92" ry="92" fill="#161412"/>

  <!-- Left tongue, tip up -->
  <path fill="url(#flameL)" d="M200 290
    C 130 260, 100 170, 160 60
