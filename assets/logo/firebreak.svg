    C 425 160, 385 225, 348 285
    C 340 305, 335 305, 345 290 Z"/>

  <!-- Inner cores -->
  <path fill="#ffd24a" opacity="0.85" d="M188 245
    C 150 225, 145 160, 180 110
    C 192 165, 202 200, 208 235
    C 210 250, 200 255, 188 245 Z"/>
  <path fill="#ffe9a0" opacity="0.85" d="M256 160
    C 238 115, 262 70, 288 62
    C 288 110, 274 140, 266 162
    C 260 172, 258 168, 256 160 Z"/>

  <!-- Heavy comic F -->
  <path fill="#2a1200" d="M148 120 L378 106 L362 196 L244 204 L236 250 L332 242 L316 326 L224 334 L208 438 L132 446 Z"/>
  <path fill="url(#gold)" d="M168 136 L356 124 L344 186 L230 194 L222 242 L312 234 L298 302 L214 310 L200 418 L154 424 Z"/>
  <path fill="#fff6c8" d="M186 150 L300 140 L292 176 L226 182 L220 220 L286 214 L278 250 L214 256 L208 290 L198 290 L190 168 Z"/>
