[preset.0]

name="Linux Desktop"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,data/stages/*.json"
exclude_filter="qa/*,tests/*,tools/*,docs/*,snap/*,_to_delete/*,build/*,*.md"
export_path="build/Firebreak/Firebreak.x86_64"

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=true
debug/export_console_wrapper=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
